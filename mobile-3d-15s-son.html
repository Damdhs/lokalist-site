<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lokalist — mobile 3D 15s (avec son)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  :root{ --a:#F3A52E; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:linear-gradient(180deg,#F4F7F2 0%,#EAF3EC 100%);
    background-color:#EFF4EE;overflow:hidden;
  }
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(#1d9e7511 1px,transparent 1px),linear-gradient(90deg,#1d9e7511 1px,transparent 1px);
    background-size:44px 44px;}
  .hv3d-stage{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;height:560px;margin:6px auto 34px;perspective:1500px}
  .hv3d-frame{position:relative;width:var(--hv3d-lh);height:var(--hv3d-lw);transform:scale(var(--hv3d-s,1));--hv3d-lw:460px;--hv3d-lh:259px;animation:hv3dFloat 6s ease-in-out infinite}
  .hv3d-frame:has(.hv3d-phone.hv3d-playing){animation:none}
  .hv3d-anchor{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .hv3d-phone{position:relative;width:var(--hv3d-lw);height:var(--hv3d-lh);border-radius:38px;transform-style:preserve-3d;transform:rotateX(6deg) rotateZ(-90deg);transition:transform 1.1s cubic-bezier(.7,.04,.2,1);cursor:pointer}
  .hv3d-phone.hv3d-playing{transform:rotateX(0) rotateZ(0deg) scale(1.06)}
  .hv3d-coque{position:absolute;inset:0;border-radius:38px;background:linear-gradient(145deg,#243029,#0B1612);padding:9px;box-shadow:0 2px 2px rgba(255,255,255,.06) inset,0 -2px 6px rgba(0,0,0,.55) inset,0 44px 90px -22px rgba(11,22,18,.6)}
  .hv3d-tranche{position:absolute;inset:0;border-radius:38px;background:#05100c;transform:translateZ(-14px)}
  .hv3d-screen{position:absolute;inset:9px;border-radius:30px;overflow:hidden;background:#000}
  .hv3d-screen::before{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,transparent 32%);mix-blend-mode:screen}
  .hv3d-notch{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:15px;height:54px;background:#0B1612;border-radius:8px;z-index:6;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .hv3d-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block;pointer-events:none}
  /* couche transparente qui capte le clic a la place de la video -> plus jamais de barre native */
  .hv3d-hit{position:absolute;inset:0;z-index:7;cursor:pointer;background:transparent}
  .hv3d-poster{position:absolute;inset:0;z-index:4;background:radial-gradient(120% 90% at 50% 0%,rgba(29,158,117,.35),transparent 62%),linear-gradient(160deg,#0F6E56,#0B1612);transition:opacity .45s ease}
  .hv3d-playing .hv3d-poster{opacity:0;pointer-events:none}
  .hv3d-poster-in{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;white-space:nowrap}
  .hv3d-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;color:#fff;letter-spacing:-1px}
  .hv3d-logo b{color:var(--a)}
  .hv3d-play{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;animation:hv3dPulse 2.4s ease-in-out infinite}
  .hv3d-play::after{content:'';width:0;height:0;margin-left:5px;border-left:19px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
  .hv3d-cap{color:rgba(255,255,255,.72);font-size:12.5px;letter-spacing:.3px;font-weight:600}
  @keyframes hv3dFloat{0%,100%{translate:0 -5px}50%{translate:0 5px}}
  @keyframes hv3dPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 15px rgba(255,255,255,0)}}
  .hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:700;color:#0F6E56;background:#fff;border:1px solid #cfe5da;padding:9px 18px;border-radius:100px;box-shadow:0 8px 24px rgba(15,110,86,.12);transition:opacity .4s ease}
  .hint.gone{opacity:0;pointer-events:none}
  video::-webkit-media-controls{display:none !important}
  video::-webkit-media-controls-enclosure{display:none !important}
  video::-webkit-media-controls-panel{display:none !important}
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="hv3d-stage">
    <div class="hv3d-frame">
      <div class="hv3d-anchor">
        <div class="hv3d-phone" id="hv3dPhone" role="button" tabindex="0" aria-label="Video Lokalist 15s">
          <div class="hv3d-tranche"></div>
          <div class="hv3d-coque"></div>
          <div class="hv3d-screen">
            <video class="hv3d-video" id="hv3dVideo" src="https://lokalist.fr/videos/hero-15s.mp4" playsinline loop preload="auto" tabindex="-1"></video>
            <div class="hv3d-hit" id="hv3dHit" aria-hidden="true"></div>
            <div class="hv3d-poster">
              <div class="hv3d-poster-in">
                <div class="hv3d-logo">Loka<b>list</b></div>
                <div class="hv3d-play" aria-hidden="true"></div>
                <div class="hv3d-cap">Voir Lokalist en 15 s</div>
              </div>
            </div>
            <div class="hv3d-notch"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">Clique sur le téléphone pour lancer (avec le son)</div>
  <script>
  (function(){
    var p=document.getElementById("hv3dPhone"),v=document.getElementById("hv3dVideo"),hint=document.getElementById("hint"),hit=document.getElementById("hv3dHit");
    if(!p||!v)return;
    var f=p.closest(".hv3d-frame")||p.parentNode;
    function fit(){
      if(!v.videoWidth||!v.videoHeight)return;
      var r=v.videoWidth/v.videoHeight;
      var lw=460, lh=Math.round(lw/(r>0?r:1.777));
      f.style.setProperty("--hv3d-lw",lw+"px");
      f.style.setProperty("--hv3d-lh",lh+"px");
    }
    v.addEventListener("loadedmetadata",fit);
    if(v.readyState>=1)fit();
    function play(){
      p.classList.add("hv3d-playing");
      if(hint)hint.classList.add("gone");
      try{ v.controls=false; v.muted=false; v.volume=1; v.currentTime=0; var q=v.play(); if(q&&q.catch)q.catch(function(){}); }catch(e){}
    }
    function stop(){p.classList.remove("hv3d-playing");try{v.pause();v.currentTime=0;}catch(e){}}
    function toggle(){p.classList.contains("hv3d-playing")?stop():play();}
    // le clic passe par la couche transparente (jamais sur la video)
    if(hit)hit.addEventListener("click",toggle);
    p.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
    // securite : si Chrome tente d'afficher des controles, on les coupe
    v.removeAttribute("controls");
  })();
  </script>
</body>
</html>
