<!DOCTYPE html>
<html lang="fr">
<head><!-- BRICOLAGE_SWAP_V1 -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paiement confirmé — Lokalist</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--g:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;--gm:#A7F3D0;--bg:#F7F8F4;--dark:#0B1612;--text:#1A2E26;--muted:#5C7268;--surf:#fff;--bdr:#D8E8E2}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--surf);border:1px solid var(--bdr);border-radius:24px;padding:48px 40px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.06)}
    .ico{width:76px;height:76px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
    .ico svg{width:38px;height:38px;stroke:var(--g);stroke-width:3;fill:none}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;color:var(--dark);margin-bottom:12px;letter-spacing:-.5px}
    p{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:28px}
    .btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:13px 28px;border-radius:100px;transition:background .2s}
    .btn:hover{background:var(--gd)}
    .sub{margin-top:18px;font-size:12.5px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">
      <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>
    </div>
    <h1>Paiement confirmé</h1>
    <p>Vos crédits ont été ajoutés à votre compte. Vous pouvez dès maintenant répondre aux projets près de chez vous.</p>
    <a class="btn" href="https://dashboard.lokalist.fr/pages/pros.html#mp-opportunites">Retour à mon espace</a>
    <div class="sub">Un reçu vous a été envoyé par e-mail.</div>
  </div>
</body>
</html>
