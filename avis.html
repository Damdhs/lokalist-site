<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Laisser un avis — Lokalist</title>
  <style>
    :root{ --vert:#1D9E75; --vert-d:#0F6E56; --bg:#F9F8F6; --txt:#1A2A24; --muted:#6B7770; --border:#E6EAE8; --or:#E8A13A; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--txt); }
    .wrap{ max-width:560px; margin:0 auto; padding:20px 16px 120px; }
    .brand{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; color:var(--vert); margin-bottom:18px; }
    .brand-logo{ width:26px; height:26px; display:block; }
    .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; }
    .cible-lbl{ font-size:12px; font-weight:700; color:var(--vert); text-transform:uppercase; letter-spacing:.5px; }
    .cible-head{ display:flex; align-items:center; gap:12px; margin:4px 0 2px; }
    .cible-logo{ width:46px; height:46px; border-radius:12px; object-fit:cover; border:1px solid var(--border); background:#fff; flex:none; }
    .cible-nom{ font-size:22px; font-weight:800; line-height:1.1; }
    .cible-sub{ font-size:14px; color:var(--muted); margin:8px 0 0; }
    .q{ font-size:15px; font-weight:700; margin:18px 0 8px; }
    .stars{ display:flex; gap:6px; }
    .star{ font-size:38px; line-height:1; cursor:pointer; color:#D5DAD7; background:none; border:none; padding:0; }
    .star.on{ color:var(--or); }
    input[type=text], textarea{ width:100%; border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--txt); }
    textarea{ min-height:110px; resize:vertical; }
    .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
    .state-screen{ text-align:center; padding:48px 20px; }
    .state-icon{ font-size:44px; }
    .state-title{ font-size:20px; font-weight:800; margin-top:10px; }
    .state-msg{ font-size:15px; color:var(--muted); margin-top:8px; line-height:1.6; }
    .loader{ width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--vert); border-radius:50%; margin:0 auto; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .success-mark{ width:56px; height:56px; border-radius:50%; background:var(--vert); color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto; }
    .sticky{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); padding:14px 16px; }
    .sticky-inner{ max-width:560px; margin:0 auto; }
    .btn{ width:100%; background:var(--vert); color:#fff; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
    .btn:hover{ background:var(--vert-d); }
    .btn:disabled{ background:#9AA3AB; cursor:default; }
    .fb{ margin-top:12px; padding:11px 12px; border-radius:10px; font-size:14px; }
    .fb.ok{ background:#E7F6EF; color:#0F6E56; }
    .fb.ko{ background:#FCEBEA; color:#B23B33; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img class="brand-logo" src="/favicon.svg" alt=""/> Lokalist</div>
    <div class="app" id="app">
      <div class="card"><div class="state-screen"><div class="loader"></div><div class="state-title" style="margin-top:14px">Chargement…</div></div></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kukathominhssogthplc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1a2F0aG9taW5oc3NvZ3RocGxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTU2NDMsImV4cCI6MjA5MDQzMTY0M30.nrfnhLWA_N-d5EA0qMvSTgSvbebbqHvWuCwk4PQDxcg';
    const API_URL = 'https://lokalist-api-production.up.railway.app';

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || params.get('t') || window.location.pathname.split('/').filter(Boolean).pop();

    const LBL = { commercant:'Commerçant', artisan:'Artisan', agence:'Agence', courtier:'Courtier' };
    const TABLE = { commercant:'commercants', artisan:'artisans', agence:'agences_immo', courtier:'courtiers_immo' };
    function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    let note = 0;

    async function chargerPro(cibleType, cibleId){
      const table = TABLE[cibleType];
      if (!table) return {};
      try {
        const { data } = await sb.from(table).select('*').eq('id', cibleId).maybeSingle();
        if (!data) return {};
        const nom = data.nom_entreprise || data.nom || '';
        const logo = data.logo_url || data.photo_url || null;
        return { nom, logo };
      } catch (e) { return {}; }
    }

    async function init(){
      if (!token || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
        return renderError('Lien invalide', "Ce lien ne correspond à aucune invitation. Vérifiez votre email.");
      }
      try {
        const r = await fetch(API_URL + '/avis/invitations/' + encodeURIComponent(token));
        const data = await r.json().catch(() => ({}));
        if (r.status === 404) return renderError('Invitation introuvable', "Ce lien ne correspond à aucune invitation.");
        if (r.status === 410) return renderError('Lien expiré ou déjà utilisé', "Cette invitation n'est plus valable.");
        if (!r.ok) return renderError('Erreur', "Impossible de charger l'invitation, réessayez.");
        const pro = await chargerPro(data.cibleType || data.cible_type, data.cibleId || data.cible_id);
        renderForm(data, pro);
      } catch (e) {
        renderError('Connexion impossible', 'Réessayez dans un instant.');
      }
    }

    function renderError(title, msg){
      document.querySelector('.sticky')?.remove();
      app.innerHTML = '<div class="card"><div class="state-screen"><div class="state-icon">⚠️</div><div class="state-title">'+esc(title)+'</div><div class="state-msg">'+esc(msg)+'</div></div></div>';
    }

    function renderForm(inv, pro){
      const cibleType = inv.cibleType || inv.cible_type || '';
      const lbl = LBL[cibleType] || 'Professionnel';
      const nom = (pro && pro.nom) || 'Ce professionnel';
      const logo = (pro && pro.logo) || null;
      app.innerHTML =
        '<div class="card">'
        + '<div class="cible-lbl">'+esc(lbl)+'</div>'
        + '<div class="cible-head">'
        +   (logo ? '<img class="cible-logo" src="'+esc(logo)+'" alt=""/>' : '')
        +   '<div class="cible-nom">'+esc(nom)+'</div>'
        + '</div>'
        + '<div class="cible-sub">Partagez votre expérience en quelques secondes. Votre avis est vérifié.</div>'
        + '<div class="q">Votre note</div>'
        + '<div class="stars" id="stars">'
        +   [1,2,3,4,5].map(n => '<button type="button" class="star" data-n="'+n+'">★</button>').join('')
        + '</div>'
        + '<div class="q">Titre (facultatif)</div>'
        + '<input type="text" id="titre" maxlength="120" placeholder="Ex : Travail impeccable"/>'
        + '<div class="q">Votre commentaire</div>'
        + '<textarea id="commentaire" maxlength="2000" placeholder="Décrivez votre expérience…"></textarea>'
        + '<div class="hint">Maximum 2000 caractères.</div>'
        + '<div id="fb"></div>'
        + '</div>'
        + '<div class="sticky"><div class="sticky-inner"><button class="btn" id="btn-envoyer">Publier mon avis</button></div></div>';

      const starsEl = document.getElementById('stars');
      starsEl.querySelectorAll('.star').forEach(b => {
        b.addEventListener('click', () => {
          note = parseInt(b.getAttribute('data-n'), 10);
          starsEl.querySelectorAll('.star').forEach(s => {
            s.classList.toggle('on', parseInt(s.getAttribute('data-n'),10) <= note);
          });
        });
      });

      document.getElementById('btn-envoyer').addEventListener('click', () => envoyer(inv));
    }

    function feedback(type, texte){
      const fb = document.getElementById('fb');
      if (fb) fb.innerHTML = '<div class="fb '+type+'">'+esc(texte)+'</div>';
    }

    async function envoyer(inv){
      if (note < 1) return feedback('ko', 'Merci de choisir une note.');
      const btn = document.getElementById('btn-envoyer');
      const titre = (document.getElementById('titre').value || '').trim();
      const commentaire = (document.getElementById('commentaire').value || '').trim();
      btn.disabled = true; btn.textContent = 'Envoi…';
      try {
        const r = await fetch(API_URL + '/avis/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, note, titre: titre || null, commentaire: commentaire || null })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok && data.ok) {
          document.querySelector('.sticky')?.remove();
          app.innerHTML = '<div class="card"><div class="state-screen"><div class="success-mark">✓</div><div class="state-title">Merci !</div><div class="state-msg">Votre avis a bien été envoyé. Il aide les autres habitants à choisir près de chez eux.</div></div></div>';
        } else {
          const MAP = { deja_note:"Vous avez déjà laissé un avis pour cela.", deja_utilisee:"Ce lien a déjà été utilisé.", expiree:"Ce lien a expiré.", invitation_introuvable:"Invitation introuvable.", note_invalide:"Note invalide.", trop_tot:"Il est encore un peu tôt pour laisser un avis." };
          feedback('ko', MAP[data.error] || "Une erreur est survenue, réessayez.");
          btn.disabled = false; btn.textContent = 'Publier mon avis';
        }
      } catch (e) {
        feedback('ko', 'Connexion impossible, réessayez.');
        btn.disabled = false; btn.textContent = 'Publier mon avis';
      }
    }

    init();
  </script>
</body>
</html>
