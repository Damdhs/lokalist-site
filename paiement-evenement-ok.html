<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Événement en ligne — Lokalist</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--g:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;--gm:#A7F3D0;--bg:#F7F8F4;--dark:#0B1612;--text:#1A2E26;--muted:#5C7268;--surf:#fff;--bdr:#D8E8E2;--or:#EF9F27}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--surf);border:1px solid var(--bdr);border-radius:24px;padding:48px 40px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.06)}
    .ico{width:76px;height:76px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
    .ico svg{width:38px;height:38px;stroke:var(--g);stroke-width:3;fill:none}
    h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--dark);margin-bottom:12px;letter-spacing:-.5px}
    p{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:12px}
    .highlight{background:var(--gl);border-radius:14px;padding:16px 18px;margin:20px 0 28px;font-size:14px;color:var(--text);line-height:1.6}
    .highlight strong{color:var(--gd)}
    .btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:13px 28px;border-radius:100px;transition:background .2s}
    .btn:hover{background:var(--gd)}
    .sub{margin-top:18px;font-size:12.5px;color:var(--muted)}
    .fox{font-size:15px;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">
      <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>
    </div>
    <h1>Paiement confirmé</h1>
    <p>Merci ! Votre paiement a bien été reçu.</p>
    <div class="highlight">
      🎉 Votre événement est désormais <strong>en ligne</strong> dans la rubrique <strong>Idée Sortie</strong> de l'application Lokalist, visible par les habitants près de chez vous jusqu'à sa date.
    </div>
    <a class="btn" href="https://lokalist.fr">Découvrir Lokalist</a>
    <div class="sub">Un reçu vous a été envoyé par e-mail.</div>
    <div class="fox">🦊</div>
  </div>
</body>
</html>
