<style>
  :root{
    --vert:#16866A; --vert-clair:#188E6B; --vert-fonce:#117C5E;
    --orange:#FBB321; --encre:#0F1F1A; --gris:#5b6b64; --carte:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#eaf4f0 0%,#f6faf8 55%,#eaf4f0 100%);
    color:var(--encre);display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;-webkit-font-smoothing:antialiased;
  }
  .carte{
    background:var(--carte);width:100%;max-width:420px;border-radius:24px;
    padding:40px 30px;text-align:center;
    box-shadow:0 20px 60px rgba(17,124,94,.14),0 2px 8px rgba(0,0,0,.04);
  }
  .logo{
    width:92px;height:92px;border-radius:22px;margin:0 auto 20px;display:block;
    box-shadow:0 10px 24px rgba(17,124,94,.30);
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
  .accroche{color:var(--gris);font-size:16px;line-height:1.5;margin-bottom:28px}
  .accroche b{color:var(--vert-fonce)}
  .boutons{display:flex;flex-direction:column;gap:12px}
  .store{
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--encre);color:#fff;text-decoration:none;
    padding:14px 20px;border-radius:14px;font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .store:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,31,26,.25)}
  .store svg{flex:0 0 auto}
  .store .l1{font-size:11px;opacity:.75;font-weight:500;display:block;line-height:1.1}
  .store .l2{font-size:17px;font-weight:700;display:block;line-height:1.15}
  .store .txt{text-align:left}
  .qr{margin-top:30px;padding-top:26px;border-top:1px solid #eef1ef}
  .qr img{width:150px;height:150px;border-radius:12px;background:#fff;border:6px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .qr p{color:var(--gris);font-size:14px;margin-top:12px}
  .pied{margin-top:26px;color:#9aa8a2;font-size:13px}
  .pied a{color:var(--vert-fonce);text-decoration:none;font-weight:600}
</style>
